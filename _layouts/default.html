<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <section class="page-header">
      <img src="{{ '/images/UoM_Logo_Vert_Housed_CMYK.jpg' | relative_url }}" alt="University of Melbourne" class="partner-logo unimelb-logo">
      <img src="{{ '/images/Doherty-Institute.png' | relative_url }}" alt="Doherty Institute" class="partner-logo doherty-logo">
      <img src="{{ '/images/SpleenAttack_Logo.png' | relative_url }}" alt="Spleen Attack" class="banner-image">
    </section>
    <section class="main-content">
      {{ content }}

    </section>
    <section class="page-footer">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap');

            .mdap-wordmark {
                /* Dark theme (the showcase site's default) */
                --mdap-text: #e6edf3;
                --mdap-highlight: #a3e4f7;

                display: grid;
                margin: 0;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                font-size: 1.4rem;
                font-weight: 800;
                line-height: normal;
                letter-spacing: -0.01em;
                text-transform: uppercase;
                color: var(--mdap-text);
                -webkit-font-smoothing: antialiased;
            }

            /* Light theme: add class="mdap-wordmark mdap-wordmark--light" */
            .mdap-wordmark--light {
                --mdap-text: #1f2328;
                --mdap-highlight: #558d9e;
            }

            /* Single-line variant (what the site uses on mobile) */
            .mdap-wordmark--inline {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                column-gap: 0.3em;
            }

            .mdap-wordmark .mdap-highlight {
                color: var(--mdap-highlight);
            }

            .page-footer {
                display: flex;
                justify-content: center;
                padding-bottom: 30px;
            }
        </style>

        <p class="mdap-wordmark mdap-wordmark--inline">
            <span>MELBOURNE</span>
            <span class="mdap-highlight">DATA ANALYTICS</span>
            <span>PLATFORM</span>
        </p>
    </section>
  </body>
</html>
